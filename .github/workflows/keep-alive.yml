name: Keep Render Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier 15-min spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://finance-dashboard-xvd8.onrender.com/health)
          echo "Health check status: $status"
          if [ "$status" != "200" ]; then
            echo "Warning: non-200 status ($status)"
            exit 1
          fi
